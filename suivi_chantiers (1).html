<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEROGOMM · Suivi Chantiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181C;
    --steel:#4A5A63;
    --steel-light:#8A97A0;
    --bg:#EEF0F1;
    --panel:#FFFFFF;
    --line:#D7DBDD;
    --blue:#2C5F7C;
    --blue-dim:#E4ECF0;
    --orange:#E85D04;
    --orange-dim:#FCE6D6;
    --green:#3F8F5F;
    --green-dim:#E1EFE6;
    --amber:#C98A0C;
    --amber-dim:#F7EBD3;
    --red:#C23B3B;
    --red-dim:#F7DEDE;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    background:var(--ink);
    color:#fff;
    padding:16px 16px 0 16px;
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    margin-bottom:14px;
  }
  .brand-left{display:flex;align-items:baseline;gap:8px;}
  .brand .mark{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    letter-spacing:0.5px;
    font-size:18px;
  }
  .brand .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#9BA7AE;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .brand-profile{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#fff;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .logout-btn{
    background:none;
    border:1px solid #3A444B;
    color:#9BA7AE;
    border-radius:6px;
    padding:4px 8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    cursor:pointer;
  }
  .tabs{
    display:flex;
    gap:2px;
    padding-bottom:0;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:10px 4px;
    font-family:'Oswald',sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.3px;
    color:#9BA7AE;
    background:transparent;
    border:none;
    border-bottom:3px solid transparent;
    cursor:pointer;
  }
  .tab.active{
    color:#fff;
    border-bottom:3px solid var(--orange);
  }
  main{
    padding:16px;
    max-width:720px;
    margin:0 auto;
    padding-bottom:60px;
  }
  .h-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--steel);
    margin:0 0 4px 0;
  }
  h2{
    font-family:'Oswald',sans-serif;
    font-size:22px;
    margin:0 0 16px 0;
    letter-spacing:0.2px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:10px;
    cursor:pointer;
    transition:border-color .15s ease;
  }
  .card:hover{border-color:var(--steel-light);}
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .card-title{
    font-weight:600;
    font-size:15px;
  }
  .card-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--steel);
    margin-top:4px;
  }
  .badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
    font-weight:500;
    background:var(--blue-dim);
    color:var(--blue);
  }
  .badge-dot{
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    margin-right:5px;
    vertical-align:middle;
  }
  .back-btn{
    background:none;
    border:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--steel);
    cursor:pointer;
    padding:0 0 12px 0;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .detail-head{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .detail-head .row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--steel);
    margin-top:6px;
    font-family:'IBM Plex Mono',monospace;
  }
  .subtabs{
    display:flex;
    gap:8px;
    margin-bottom:14px;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  .subtab{
    padding:8px 4px 10px 4px;
    background:none;
    border:none;
    font-family:'Oswald',sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--steel);
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    white-space:nowrap;
  }
  .subtab.active{
    color:var(--ink);
    border-bottom:2px solid var(--ink);
  }
  .msg{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px;
    margin-bottom:8px;
  }
  .msg-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  .msg-auteur{
    font-weight:600;
    font-size:13px;
  }
  .msg-date{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--steel-light);
  }
  .msg-dest{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    color:var(--steel);
    letter-spacing:0.5px;
    margin-bottom:6px;
  }
  .msg-body{font-size:13.5px;line-height:1.45;}
  .composer{
    display:flex;
    gap:8px;
    align-items:center;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px;
    position:sticky;
    bottom:12px;
  }
  .composer select{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px;
    background:#fff;
  }
  .composer input[type=text]{
    flex:1;
    border:none;
    outline:none;
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:8px;
  }
  .icon-btn{
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:8px;
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn.send{background:var(--blue);}
  form.demande, form.frais{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:16px;
  }
  form.demande label, form.frais label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--steel);
    margin:10px 0 4px 0;
  }
  form.demande label:first-child, form.frais label:first-child{margin-top:0;}
  form.demande select, form.demande input, form.frais select, form.frais input, form.frais textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    background:#fff;
  }
  form.frais textarea{resize:vertical;min-height:60px;font-family:'Inter',sans-serif;}
  .type-toggle{
    display:flex;
    gap:8px;
  }
  .type-opt{
    flex:1;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px;
    text-align:center;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    background:#fff;
  }
  .type-opt.sel-fonds.selected{border-color:var(--blue);background:var(--blue-dim);color:var(--blue);}
  .type-opt.sel-entrepot.selected{border-color:var(--green);background:var(--green-dim);color:var(--green);}
  .routage{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--steel);
    margin-top:8px;
  }
  .submit-btn{
    margin-top:14px;
    width:100%;
    padding:11px;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:8px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.3px;
    cursor:pointer;
  }
  .submit-btn:disabled{opacity:0.5;cursor:default;}
  .demande-item{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px;
    margin-bottom:8px;
  }
  .demande-item .top{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .demande-item .fourniture{font-weight:600;font-size:13.5px;}
  .demande-item .meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--steel);
    margin-top:4px;
  }
  .urg-bloquant{color:var(--orange);font-weight:600;}
  .kanban{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding-bottom:8px;
  }
  .kcol{min-width:230px;flex:1;}
  .kcol-head{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.4px;
    text-transform:uppercase;
    padding:8px 4px;
  }
  .kcard{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--steel-light);
    border-radius:8px;
    padding:10px;
    margin-bottom:8px;
    font-size:13px;
    cursor:pointer;
  }
  .kcard .k-title{font-weight:600;margin-bottom:3px;}
  .kcard .k-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--steel);
  }
  .section-title{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    font-weight:600;
    margin:22px 0 10px 0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title .count{
    background:var(--orange);
    color:#fff;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:1px 7px;
    border-radius:20px;
  }
  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--steel);
    font-size:13px;
  }
  .divider{
    height:6px;
    margin:18px 0;
    background-image:radial-gradient(var(--steel-light) 0.8px, transparent 0.8px);
    background-size:8px 8px;
    opacity:0.4;
  }
  .approve-row{display:flex;gap:8px;margin-top:10px;}
  .approve-row button{
    flex:1;
    padding:8px;
    border-radius:6px;
    border:1px solid var(--line);
    background:#fff;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    cursor:pointer;
  }
  .approve-row button.ok{border-color:var(--green);color:var(--green);}
  .approve-row button.no{border-color:var(--orange);color:var(--orange);}
  .st-en_attente{background:var(--amber-dim);color:var(--amber);}
  .st-valide, .st-sorti, .st-commande{background:var(--green-dim);color:var(--green);}
  .st-refuse{background:var(--red-dim);color:var(--red);}

  /* ---------- LOGIN ---------- */
  .login-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .login-box{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px 24px;
    width:100%;
    max-width:380px;
    text-align:center;
  }
  .login-box .mark{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.5px;
  }
  .login-box .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--steel);
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:22px;
  }
  .team-btn{
    display:block;
    width:100%;
    padding:14px;
    margin-bottom:10px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
    font-family:'Oswald',sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    text-align:left;
  }
  .team-btn:hover{border-color:var(--blue);color:var(--blue);}
  .admin-link{
    margin-top:14px;
    background:none;
    border:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--steel-light);
    text-transform:uppercase;
    letter-spacing:0.6px;
    cursor:pointer;
  }
  .code-row{display:flex;gap:8px;margin-top:14px;}
  .code-row input{
    flex:1;
    padding:12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:16px;
    text-align:center;
    letter-spacing:2px;
  }
  .code-row button{
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:0 18px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    cursor:pointer;
  }
  .login-error{color:var(--red);font-size:12px;margin-top:10px;font-family:'IBM Plex Mono',monospace;}
  .login-back{
    margin-top:14px;
    background:none;border:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--steel);cursor:pointer;
  }
  .cfg-box textarea, .cfg-box input{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    margin-bottom:10px;
  }
  .cfg-box label{
    display:block;text-align:left;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;text-transform:uppercase;letter-spacing:0.6px;
    color:var(--steel);margin-bottom:4px;
  }
  .loading{text-align:center;padding:40px 20px;color:var(--steel);font-size:13px;font-family:'IBM Plex Mono',monospace;}
  .dropzone{
    border:2px dashed var(--line);
    border-radius:8px;
    padding:16px;
    text-align:center;
    font-size:12px;
    color:var(--steel);
    cursor:pointer;
    margin-bottom:4px;
  }
  .dropzone.drag{border-color:var(--blue);color:var(--blue);}
  .file-preview{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--green);margin-top:6px;}
  select#adminTeamFilter{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:6px 8px;
    border-radius:6px;
    border:1px solid var(--line);
    margin-bottom:12px;
    background:#fff;
  }
</style>
</head>
<body>

<div id="root"></div>

<script>
// ============================================================
// CONFIG (Airtable) — saisie une fois par appareil, stockée en localStorage
// ============================================================
const BASE_ID = 'appeDIbbdUiiO529W';
const T = {
  CHANTIERS: 'Chantiers',
  PROFILS: 'Profils_Techniciens',
  SUIVI: 'Suivi_Chantier',
  FOURNITURES: 'Demandes_Fournitures',
  FRAIS: 'Frais'
};
const ADMIN_CODE = '49460';
const ADMIN_NAME = 'David — Administrateur';

function getCfg(){
  try{ return JSON.parse(localStorage.getItem('suiviChantiersCfg') || 'null'); }catch(e){ return null; }
}
function setCfg(cfg){ localStorage.setItem('suiviChantiersCfg', JSON.stringify(cfg)); }

function getSession(){
  try{ return JSON.parse(localStorage.getItem('suiviChantiersSession') || 'null'); }catch(e){ return null; }
}
function setSession(s){ localStorage.setItem('suiviChantiersSession', JSON.stringify(s)); }
function clearSession(){ localStorage.removeItem('suiviChantiersSession'); }

// ============================================================
// AIRTABLE HELPERS
// ============================================================
async function atFetch(table, params){
  const cfg = getCfg();
  const qs = params ? '?' + params : '';
  const res = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(table)}${qs}`, {
    headers: { 'Authorization': `Bearer ${cfg.pat}` }
  });
  if(!res.ok) throw new Error('Erreur Airtable ('+table+') : '+res.status);
  return res.json();
}
async function atCreate(table, fields){
  const cfg = getCfg();
  const res = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(table)}`, {
    method:'POST',
    headers:{ 'Authorization': `Bearer ${cfg.pat}`, 'Content-Type':'application/json' },
    body: JSON.stringify({ fields, typecast:true })
  });
  if(!res.ok) throw new Error('Erreur création ('+table+') : '+res.status);
  return res.json();
}
async function atUpdate(table, recordId, fields){
  const cfg = getCfg();
  const res = await fetch(`https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(table)}/${recordId}`, {
    method:'PATCH',
    headers:{ 'Authorization': `Bearer ${cfg.pat}`, 'Content-Type':'application/json' },
    body: JSON.stringify({ fields, typecast:true })
  });
  if(!res.ok) throw new Error('Erreur mise à jour ('+table+') : '+res.status);
  return res.json();
}
async function atUploadAttachment(recordId, fieldName, base64, contentType, filename){
  const cfg = getCfg();
  const res = await fetch(`https://content.airtable.com/v0/${BASE_ID}/${recordId}/${encodeURIComponent(fieldName)}/uploadAttachment`, {
    method:'POST',
    headers:{ 'Authorization': `Bearer ${cfg.pat}`, 'Content-Type':'application/json' },
    body: JSON.stringify({ contentType, file: base64, filename })
  });
  if(!res.ok) throw new Error('Erreur upload justificatif : '+res.status);
  return res.json();
}

// ============================================================
// STATE
// ============================================================
let profils = [];       // depuis Profils_Techniciens
let chantiers = [];      // depuis Chantiers (filtrés équipe)
let currentChantier = null;
let currentSubtab = 'fil';
let suiviCache = [];
let fournituresCache = [];
let fraisCache = [];
let pendingFournitures = [];
let pendingFrais = [];
let adminTeamFilter = 'ALL';
let loginStep = 'pick';   // pick | code | admin-code
let loginTeamPicked = null;
let loginError = '';

const root = document.getElementById('root');

// ============================================================
// BOOT
// ============================================================
async function boot(){
  const cfg = getCfg();
  if(!cfg || !cfg.pat){ renderCfgScreen(); return; }
  const session = getSession();
  if(!session){ await renderLogin(); return; }
  await renderApp(session);
}

// ============================================================
// ÉCRAN CONFIG (première utilisation sur l'appareil)
// ============================================================
function renderCfgScreen(){
  root.innerHTML = `
    <div class="login-wrap">
      <div class="login-box cfg-box">
        <div class="mark">AEROGOMM</div>
        <div class="sub">Configuration de l'appareil</div>
        <label>Jeton d'accès Airtable (PAT)</label>
        <input type="password" id="patInput" placeholder="patXXXXXXXXXXXXXX">
        <button class="submit-btn" id="cfgSaveBtn">Enregistrer</button>
        <div class="login-error" id="cfgErr"></div>
      </div>
    </div>
  `;
  document.getElementById('cfgSaveBtn').addEventListener('click', ()=>{
    const pat = document.getElementById('patInput').value.trim();
    if(!pat){ document.getElementById('cfgErr').textContent = 'Jeton requis.'; return; }
    setCfg({ pat });
    boot();
  });
}

// ============================================================
// ÉCRAN LOGIN
// ============================================================
async function renderLogin(){
  root.innerHTML = `<div class="loading">Chargement des profils…</div>`;
  try{
    if(profils.length===0){
      const data = await atFetch(T.PROFILS);
      profils = data.records.map(r=>({ id:r.id, code:String(r.fields.Code||'').trim(), equipe:r.fields.EquipeAffectee||'', nom:r.fields.NomAffichage||r.fields.EquipeAffectee||'' }));
    }
  }catch(e){
    root.innerHTML = `<div class="login-wrap"><div class="login-box"><div class="mark">AEROGOMM</div><div class="login-error">Impossible de charger les profils.<br>${e.message}</div></div></div>`;
    return;
  }
  drawLogin();
}

function drawLogin(){
  let inner = '';
  if(loginStep==='pick'){
    inner = `
      <div class="mark">AEROGOMM</div>
      <div class="sub">Suivi Chantiers</div>
      ${profils.map(p=>`<button class="team-btn" data-code="${p.code}" data-equipe="${p.equipe}" data-nom="${p.nom}">${p.nom}</button>`).join('')}
      <button class="admin-link" id="adminLinkBtn">Accès administrateur</button>
    `;
  } else if(loginStep==='code'){
    inner = `
      <div class="mark">${loginTeamPicked.nom}</div>
      <div class="sub">Entrez votre code</div>
      <div class="code-row">
        <input type="password" inputmode="numeric" id="codeInput" placeholder="Code">
        <button id="codeGoBtn">OK</button>
      </div>
      ${loginError ? `<div class="login-error">${loginError}</div>` : ''}
      <button class="login-back" id="loginBackBtn">← Retour</button>
    `;
  } else if(loginStep==='admin-code'){
    inner = `
      <div class="mark">Administrateur</div>
      <div class="sub">Code d'accès</div>
      <div class="code-row">
        <input type="password" inputmode="numeric" id="codeInput" placeholder="Code admin">
        <button id="codeGoBtn">OK</button>
      </div>
      ${loginError ? `<div class="login-error">${loginError}</div>` : ''}
      <button class="login-back" id="loginBackBtn">← Retour</button>
    `;
  }
  root.innerHTML = `<div class="login-wrap"><div class="login-box">${inner}</div></div>`;

  document.querySelectorAll('.team-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      loginTeamPicked = { code:btn.dataset.code, equipe:btn.dataset.equipe, nom:btn.dataset.nom };
      loginStep = 'code'; loginError=''; drawLogin();
    });
  });
  const adminLinkBtn = document.getElementById('adminLinkBtn');
  if(adminLinkBtn) adminLinkBtn.addEventListener('click', ()=>{ loginStep='admin-code'; loginError=''; drawLogin(); });

  const backBtn = document.getElementById('loginBackBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{ loginStep='pick'; loginError=''; drawLogin(); });

  const goBtn = document.getElementById('codeGoBtn');
  if(goBtn){
    const submit = ()=>{
      const val = document.getElementById('codeInput').value.trim();
      if(loginStep==='admin-code'){
        if(val===ADMIN_CODE){
          setSession({ role:'admin', nom:ADMIN_NAME, equipe:null });
          loginStep='pick'; boot();
        } else { loginError='Code incorrect.'; drawLogin(); }
      } else {
        if(val===loginTeamPicked.code){
          setSession({ role:'tech', nom:loginTeamPicked.nom, equipe:loginTeamPicked.equipe });
          loginStep='pick'; boot();
        } else { loginError='Code incorrect.'; drawLogin(); }
      }
    };
    goBtn.addEventListener('click', submit);
    document.getElementById('codeInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  }
}

// ============================================================
// APP (une fois connecté)
// ============================================================
async function renderApp(session){
  root.innerHTML = `
    <header>
      <div class="brand">
        <div class="brand-left">
          <span class="mark">AEROGOMM</span>
          <span class="sub">Suivi Chantiers</span>
        </div>
        <div class="brand-profile">
          ${session.nom}
          <button class="logout-btn" id="logoutBtn">Changer</button>
        </div>
      </div>
    </header>
    <main id="app"><div class="loading">Chargement des chantiers…</div></main>
  `;
  document.getElementById('logoutBtn').addEventListener('click', ()=>{ clearSession(); currentChantier=null; boot(); });

  try{
    await loadChantiers(session);
  }catch(e){
    document.getElementById('app').innerHTML = `<div class="login-error">Erreur de chargement : ${e.message}</div>`;
    return;
  }
  render(session);
}

async function loadChantiers(session){
  let formula = '';
  if(session.role==='tech'){
    formula = `?filterByFormula=${encodeURIComponent(`{EquipeAffectee}="${session.equipe}"`)}`;
  }
  const data = await atFetch(T.CHANTIERS, formula.replace('?',''));
  chantiers = data.records.map(r=>({
    id:r.id,
    entreprise:r.fields.Entreprise||'(sans nom)',
    adresse:r.fields.Adresse||'',
    interlocuteur:r.fields.Interlocuteur||'',
    commercial:r.fields.Commercial||'',
    statut:r.fields.StatutChantier||'',
    dateIntervention:r.fields.DateDebutIntervention||'',
    equipe:r.fields.EquipeAffectee||''
  })).filter(c=>!/archiv/i.test(c.statut))
     .sort((a,b)=>(a.dateIntervention||'9999').localeCompare(b.dateIntervention||'9999'));
}

function render(session){
  if(currentChantier) return renderChantierDetail(session);
  if(session.role==='admin') return renderAdminList(session);
  return renderTechList(session);
}

// ---------- VUE TECHNICIEN : liste ----------
function renderTechList(session){
  const app = document.getElementById('app');
  app.innerHTML = `
    <p class="h-eyebrow">${session.equipe}</p>
    <h2>Mes chantiers</h2>
    ${chantiers.length ? chantiers.map(c=>chantierCardHTML(c)).join('') : '<div class="empty">Aucun chantier assigné pour le moment.</div>'}
  `;
  attachCardListeners();
}

// ---------- VUE ADMIN : liste + filtre équipe ----------
function renderAdminList(session){
  const app = document.getElementById('app');
  const equipes = [...new Set(profils.map(p=>p.equipe))];
  const list = adminTeamFilter==='ALL' ? chantiers : chantiers.filter(c=>c.equipe===adminTeamFilter);
  app.innerHTML = `
    <p class="h-eyebrow">Administrateur</p>
    <h2>Tous les chantiers</h2>
    <select id="adminTeamFilter">
      <option value="ALL">Toutes les équipes</option>
      ${equipes.map(eq=>`<option value="${eq}" ${adminTeamFilter===eq?'selected':''}>${eq}</option>`).join('')}
    </select>
    ${list.length ? list.map(c=>chantierCardHTML(c,true)).join('') : '<div class="empty">Aucun chantier.</div>'}
  `;
  document.getElementById('adminTeamFilter').addEventListener('change', e=>{ adminTeamFilter=e.target.value; render(session); });
  attachCardListeners();
}

function chantierCardHTML(c, showEquipe){
  return `
    <div class="card" data-id="${c.id}">
      <div class="card-top">
        <div>
          <div class="card-title">${c.entreprise}</div>
          <div class="card-meta">${c.adresse}${showEquipe && c.equipe ? ' · '+c.equipe : ''}</div>
        </div>
        <span class="badge">${c.statut||'—'}</span>
      </div>
    </div>
  `;
}

function attachCardListeners(){
  document.querySelectorAll('.card[data-id]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      currentChantier = el.dataset.id;
      currentSubtab = 'fil';
      const session = getSession();
      document.getElementById('app').innerHTML = `<div class="loading">Chargement…</div>`;
      await renderChantierDetail(session);
    });
  });
}

// ---------- DÉTAIL CHANTIER ----------
async function renderChantierDetail(session){
  const app = document.getElementById('app');
  const c = chantiers.find(x=>x.id===currentChantier);
  if(!c){ currentChantier=null; render(session); return; }

  app.innerHTML = `
    <button class="back-btn" id="backBtn">← Retour</button>
    <div class="detail-head">
      <div class="card-top">
        <div>
          <div class="card-title">${c.entreprise}</div>
          <div class="card-meta">${c.adresse}</div>
        </div>
        <span class="badge">${c.statut||'—'}</span>
      </div>
      <div class="row">
        <span>Interlocuteur : ${c.interlocuteur||'—'}</span>
        <span>Commercial : ${c.commercial||'—'}</span>
      </div>
      <div class="row">
        <span>Intervention : ${c.dateIntervention||'non renseignée'}</span>
        <span></span>
      </div>
    </div>
    <div class="subtabs">
      <button class="subtab ${currentSubtab==='fil'?'active':''}" data-sub="fil">Fil de suivi</button>
      <button class="subtab ${currentSubtab==='fournitures'?'active':''}" data-sub="fournitures">Fournitures</button>
      <button class="subtab ${currentSubtab==='frais'?'active':''}" data-sub="frais">Frais</button>
    </div>
    <div id="subContent"><div class="loading">Chargement…</div></div>
  `;
  document.getElementById('backBtn').addEventListener('click', ()=>{ currentChantier=null; render(session); });
  document.querySelectorAll('.subtab').forEach(t=>t.addEventListener('click', async ()=>{
    currentSubtab = t.dataset.sub;
    await renderChantierDetail(session);
  }));

  const sub = document.getElementById('subContent');
  try{
    if(currentSubtab==='fil'){
      const data = await atFetch(T.SUIVI, `filterByFormula=${encodeURIComponent(`{ChantierId}="${c.id}"`)}`);
      suiviCache = data.records.map(r=>r.fields).sort((a,b)=>(a.Date||'').localeCompare(b.Date||''));
      sub.innerHTML = filHTML(suiviCache, session, c);
      attachComposer(c, session);
    } else if(currentSubtab==='fournitures'){
      const data = await atFetch(T.FOURNITURES, `filterByFormula=${encodeURIComponent(`{ChantierId}="${c.id}"`)}`);
      fournituresCache = data.records.map(r=>({id:r.id, ...r.fields}));
      sub.innerHTML = fournituresHTML(fournituresCache) + demandeFormHTML();
      attachDemandeForm(c, session);
    } else if(currentSubtab==='frais'){
      const data = await atFetch(T.FRAIS, `filterByFormula=${encodeURIComponent(`{ChantierId}="${c.id}"`)}`);
      fraisCache = data.records.map(r=>({id:r.id, ...r.fields}));
      sub.innerHTML = fraisHTML(fraisCache) + fraisFormHTML();
      attachFraisForm(c, session);
    }
  }catch(e){
    sub.innerHTML = `<div class="login-error">Erreur : ${e.message}</div>`;
  }
}

// ---------- FIL DE SUIVI ----------
function destBadgeColor(dest){
  if(dest==='Direction') return 'var(--orange)';
  return 'var(--blue)';
}
function filHTML(msgs, session, c){
  return `
    ${msgs.map(m=>`
      <div class="msg">
        <div class="msg-head">
          <span class="msg-auteur">${m.Equipe||'—'}</span>
          <span class="msg-date">${m.Date||''}</span>
        </div>
        <div class="msg-dest"><span class="badge-dot" style="background:${destBadgeColor(m.Destinataire)}"></span>→ ${m.Destinataire||'—'}</div>
        <div class="msg-body">${m.Contenu||''}</div>
      </div>
    `).join('') || '<div class="empty">Aucun message pour ce chantier.</div>'}
    ${composerHTML(c)}
  `;
}
function composerHTML(c){
  const commercialLabel = c.commercial ? c.commercial : 'Commercial';
  return `
    <div class="composer">
      <select id="destSelect">
        <option value="${commercialLabel}">${commercialLabel}</option>
        <option value="Direction">Direction</option>
      </select>
      <input type="text" id="msgInput" placeholder="Écrire un message…">
      <button class="icon-btn send" id="sendBtn" title="Envoyer">➤</button>
    </div>
  `;
}
function attachComposer(c, session){
  const send = document.getElementById('sendBtn');
  if(!send) return;
  send.addEventListener('click', async ()=>{
    const input = document.getElementById('msgInput');
    const dest = document.getElementById('destSelect').value;
    if(!input.value.trim()) return;
    send.disabled = true;
    try{
      await atCreate(T.SUIVI, {
        ChantierId: c.id,
        Equipe: session.nom,
        Destinataire: dest,
        Contenu: input.value.trim(),
        Date: new Date().toISOString()
      });
      await renderChantierDetail(session);
    }catch(e){ alert('Erreur envoi message : '+e.message); send.disabled=false; }
  });
}

// ---------- FOURNITURES ----------
function fournituresHTML(reqs){
  return `
    <p class="section-title">Demandes sur ce chantier</p>
    ${reqs.map(d=>`
      <div class="demande-item">
        <div class="top">
          <span class="fourniture">${d.Fourniture||''}</span>
          <span class="badge st-${statutClass(d.Statut)}">${d.TypeDemande==='Fonds'?'Commande fonds':'Sortie entrepôt'}</span>
        </div>
        <div class="meta">${d.Quantite||''} · ${d.Urgence==='Bloquant'?'<span class="urg-bloquant">Bloquant</span>':(d.Urgence||'Normal')} · Statut : ${d.Statut||'En attente'}</div>
      </div>
    `).join('') || '<div class="empty">Aucune demande pour ce chantier.</div>'}
  `;
}
function statutClass(s){
  if(!s) return 'en_attente';
  const v = s.toLowerCase();
  if(v.includes('attente')) return 'en_attente';
  if(v.includes('refus')) return 'refuse';
  if(v.includes('sorti')||v.includes('command')||v.includes('valid')) return 'valide';
  return 'en_attente';
}
function demandeFormHTML(){
  return `
    <p class="section-title">Nouvelle demande</p>
    <form class="demande" id="demandeForm">
      <label>Type de demande</label>
      <div class="type-toggle">
        <div class="type-opt sel-fonds" data-type="Fonds">Commande fonds</div>
        <div class="type-opt sel-entrepot selected" data-type="Entrepot">Sortie entrepôt</div>
      </div>
      <label>Fourniture</label>
      <input type="text" id="fournitureInput" placeholder="Ex : Buse céramique Ø8" required>
      <label>Quantité</label>
      <input type="text" id="quantiteInput" placeholder="Ex : 2 unités" required>
      <label>Urgence</label>
      <select id="urgenceInput">
        <option>Normal</option>
        <option>Urgent</option>
        <option>Bloquant</option>
      </select>
      <button type="submit" class="submit-btn">Envoyer la demande</button>
    </form>
  `;
}
function attachDemandeForm(c, session){
  let type = 'Entrepot';
  document.querySelectorAll('.type-opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      document.querySelectorAll('.type-opt').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
      type = opt.dataset.type;
    });
  });
  document.getElementById('demandeForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const btn = e.target.querySelector('.submit-btn');
    btn.disabled = true;
    try{
      await atCreate(T.FOURNITURES, {
        ChantierId: c.id,
        Equipe: session.nom,
        Fourniture: document.getElementById('fournitureInput').value,
        Quantite: document.getElementById('quantiteInput').value,
        Urgence: document.getElementById('urgenceInput').value,
        TypeDemande: type,
        Statut: 'En attente',
        Date: new Date().toISOString()
      });
      await renderChantierDetail(session);
    }catch(err){ alert('Erreur : '+err.message); btn.disabled=false; }
  });
}

// ---------- FRAIS ----------
function fraisHTML(list){
  return `
    <p class="section-title">Frais déclarés</p>
    ${list.map(f=>`
      <div class="demande-item">
        <div class="top">
          <span class="fourniture">${f.TypeFrais||''} — ${f.Montant!=null?f.Montant+' €':''}</span>
          <span class="badge st-${statutClass(f.Statut)}">${f.Statut||'En attente'}</span>
        </div>
        <div class="meta">${f.Commentaire||''}</div>
      </div>
    `).join('') || '<div class="empty">Aucun frais déclaré pour ce chantier.</div>'}
  `;
}
function fraisFormHTML(){
  return `
    <p class="section-title">Nouveau frais</p>
    <form class="frais" id="fraisForm">
      <label>Type de frais</label>
      <select id="typeFraisInput">
        <option>Carburant</option>
        <option>Péage</option>
        <option>Repas</option>
        <option>Matériel d'appoint</option>
        <option>Hébergement</option>
        <option>Autre</option>
      </select>
      <label>Montant (€)</label>
      <input type="number" step="0.01" id="montantInput" placeholder="Ex : 24.50" required>
      <label>Commentaire</label>
      <textarea id="commentaireInput" placeholder="Détail éventuel…"></textarea>
      <label>Justificatif (photo)</label>
      <div class="dropzone" id="fraisDropzone">Cliquer ou glisser une photo du ticket</div>
      <input type="file" id="fraisFileInput" accept="image/*,.pdf" style="display:none">
      <div class="file-preview" id="fraisFilePreview"></div>
      <button type="submit" class="submit-btn" id="fraisSubmitBtn">Envoyer le frais</button>
    </form>
  `;
}
function attachFraisForm(c, session){
  let selectedFile = null;
  const dz = document.getElementById('fraisDropzone');
  const fileInput = document.getElementById('fraisFileInput');
  const preview = document.getElementById('fraisFilePreview');
  dz.addEventListener('click', ()=>fileInput.click());
  dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag'); });
  dz.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
  dz.addEventListener('drop', e=>{
    e.preventDefault(); dz.classList.remove('drag');
    if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', ()=>{ if(fileInput.files[0]) handleFile(fileInput.files[0]); });
  function handleFile(file){
    if(file.size > 5*1024*1024){ preview.textContent='Fichier trop volumineux (max 5 Mo).'; preview.style.color='var(--red)'; return; }
    selectedFile = file;
    preview.style.color='var(--green)';
    preview.textContent = '✓ '+file.name;
  }

  document.getElementById('fraisForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const btn = document.getElementById('fraisSubmitBtn');
    btn.disabled = true;
    try{
      const rec = await atCreate(T.FRAIS, {
        ChantierId: c.id,
        Equipe: session.nom,
        TypeFrais: document.getElementById('typeFraisInput').value,
        Montant: parseFloat(document.getElementById('montantInput').value)||0,
        Commentaire: document.getElementById('commentaireInput').value,
        Statut: 'En attente',
        Date: new Date().toISOString()
      });
      if(selectedFile){
        const base64 = await fileToBase64(selectedFile);
        await atUploadAttachment(rec.id, 'Justificatif', base64, selectedFile.type||'application/octet-stream', selectedFile.name);
      }
      await renderChantierDetail(session);
    }catch(err){ alert('Erreur : '+err.message); btn.disabled=false; }
  });
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

boot();
</script>
