<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>Mes Fiches</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e2e6ec;--brand:#1f3a5f;--accent:#e8772e;--ok:#2e8b57;--late:#c0392b;--soft:#eef2f7}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;padding-bottom:80px;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:6;background:var(--brand);color:#fff;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:4px}
header h1{font-size:18px;margin:0;flex:1}
header button{background:transparent;border:0;color:#fff;font-size:20px;padding:6px 10px;cursor:pointer}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:20;transition:width .3s}
#bar.on{width:70%}
main{padding:12px 16px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:21px}
nav button.on{color:var(--brand);font-weight:700}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:20px 0 8px}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin:0 0 10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.muted{color:var(--mute);font-size:13px}
.big{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:600;cursor:pointer}
.listen{background:var(--accent);color:#fff;margin:4px 0 12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.ico{border:0;background:none;font-size:18px;padding:4px 6px;cursor:pointer;color:var(--mute)}
.ftitle{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ftitle b{flex:1;cursor:pointer;font-size:16px}
.step{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.step input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none}
.step .lbl{flex:1;cursor:pointer}
.step.done .lbl{text-decoration:line-through;color:var(--mute)}
.badge{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--brand);white-space:nowrap}
.badge.late{background:#fdecea;color:var(--late)}
.badge.ok{background:#e7f5ee;color:var(--ok)}
.badge.pause{background:#fff4e5;color:#a35d00}
input[type=text],input[type=date],input[type=password],select,textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;background:#fff;color:var(--ink)}
input[type=date].sm{width:auto;padding:5px 6px;font-size:14px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.row2{display:flex;gap:10px}.row2>div{flex:1}
.dict{display:flex;gap:8px;align-items:flex-start}
.mic{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:20px;cursor:pointer}
.mic.rec{background:var(--late);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(192,57,43,.2)}}
.addrow{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.folder{margin-bottom:8px}
.fhead{display:flex;align-items:center;gap:4px}
.fhead .nm{flex:1;font-weight:600;cursor:pointer;padding:6px 0}
.sub{margin-left:14px;border-left:2px solid var(--line);padding-left:10px}
.fitem{padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.fitem .t{font-weight:600}
.day{border-left:4px solid transparent}
.day.today{border-left-color:var(--accent)}
.day h3{margin:0 0 4px;font-size:15px;text-transform:capitalize}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
#panel{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;padding-bottom:40px}
#panel .top{position:sticky;top:0;background:var(--brand);color:#fff;display:flex;align-items:center;gap:6px;padding:10px 10px;z-index:2}
#panel .top input{flex:1;background:rgba(255,255,255,.12);border:0;color:#fff;font-weight:700;font-size:17px}
#panel .top button{background:none;border:0;color:#fff;font-size:20px;padding:6px 8px;cursor:pointer}
#panel .in{padding:12px 16px;max-width:720px;margin:0 auto}
.note{border-top:1px solid var(--line);padding:8px 0;white-space:pre-wrap}
.note:first-child{border-top:0}
#stop{position:fixed;right:16px;bottom:92px;z-index:15;background:var(--late);color:#fff;border:0;border-radius:30px;padding:12px 18px;font-size:15px;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.25);cursor:pointer}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:90%;text-align:center}
.empty{color:var(--mute);font-style:italic;padding:4px 0}
.setup ol{padding-left:20px;line-height:1.5}
.setup code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:14px}
</style>
</head>
<body>
<div id="bar"></div>
<header>
  <h1>📋 Mes Fiches</h1>
  <button onclick="reload()" title="Actualiser">⟳</button>
  <button onclick="showSetup()" title="Réglages">⚙</button>
</header>
<main id="main"></main>
<nav>
  <button data-v="today" onclick="go('today')"><span>☀️</span>Aujourd'hui</button>
  <button data-v="week" onclick="go('week')"><span>📅</span>Semaine</button>
  <button data-v="folders" onclick="go('folders')"><span>📁</span>Dossiers</button>
  <button data-v="history" onclick="go('history')"><span>🕘</span>Historique</button>
</nav>
<div id="panel" hidden></div>
<button id="stop" hidden onclick="stopSpeak()">⏹ Arrêter la lecture</button>
<div id="toast" hidden></div>

<script>
/* ========= Réglages & état ========= */
const T={D:'Dossiers',F:'Fiches',E:'Etapes',J:'Journal'};
const DEFAULT_FOLDERS=['Chantiers','Réseau','Commercial','Équipe','Trésorerie','Perso'];
let cfg={};try{cfg=JSON.parse(localStorage.getItem('mf_cfg')||'{}')}catch(_){}
let S={dossiers:[],fiches:[],etapes:[],journal:[]};
let view='today',weekOffset=0,openId=null,setupMode=false;
let openFolders=new Set();try{openFolders=new Set(JSON.parse(localStorage.getItem('mf_open')||'[]'))}catch(_){}
const draft={step:'',stepDate:'',note:''};

/* ========= Outils ========= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parseD(a)-parseD(b))/86400000);
const fmtShort=s=>parseD(s).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const fmtLong=s=>parseD(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const localDay=iso=>ymd(new Date(iso));
function spokenRel(s){const d=diffDays(s,today());if(d===0)return"aujourd'hui";if(d===1)return'demain';if(d===-1)return'hier';return'le '+fmtLong(s)}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3500)}
let busyN=0;function busy(on){busyN+=on?1:-1;$('#bar').classList.toggle('on',busyN>0)}
function saveOpen(){try{localStorage.setItem('mf_open',JSON.stringify([...openFolders]))}catch(_){}}

/* ========= Accès aux données ========= */
const fv=(r,k)=>r.fields[k];
const byName=(a,b)=>(fv(a,'Nom')||'').localeCompare(fv(b,'Nom')||'','fr');
const fiche=id=>S.fiches.find(f=>f.id===id);
const dossier=id=>S.dossiers.find(d=>d.id===id);
const ficheOf=e=>(fv(e,'Fiche')||[])[0];
const parentOf=d=>fv(d,'Parent')||'';
const roots=()=>S.dossiers.filter(d=>!parentOf(d)||!dossier(parentOf(d))).sort(byName);
const children=id=>S.dossiers.filter(d=>parentOf(d)===id).sort(byName);
const ficheDossier=f=>(fv(f,'Dossier')||[])[0];
function dPath(id){const d=dossier(id);if(!d)return'';const p=dossier(parentOf(d));return p?fv(p,'Nom')+' › '+fv(d,'Nom'):fv(d,'Nom')}
const sortTodo=(a,b)=>(fv(a,'Date prévue')||'9999').localeCompare(fv(b,'Date prévue')||'9999')||(fv(a,'Ordre')||0)-(fv(b,'Ordre')||0);
const sortDone=(a,b)=>(fv(a,'Date réalisation')||'').localeCompare(fv(b,'Date réalisation')||'')||(fv(a,'Ordre')||0)-(fv(b,'Ordre')||0);
const stepsOf=id=>S.etapes.filter(e=>ficheOf(e)===id);
const todoOf=id=>stepsOf(id).filter(e=>!fv(e,'Faite')).sort(sortTodo);
const doneOf=id=>stepsOf(id).filter(e=>fv(e,'Faite')).sort(sortDone);
const notesOf=id=>S.journal.filter(j=>(fv(j,'Fiche')||[])[0]===id).sort((a,b)=>(fv(b,'Moment')||'').localeCompare(fv(a,'Moment')||''));

/* ========= API Airtable ========= */
async function api(path,opts={}){
  const r=await fetch('https://api.airtable.com/v0/'+path,{...opts,headers:{Authorization:'Bearer '+cfg.token,'Content-Type':'application/json'}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=j.error;throw new Error((e&&(e.message||e.type))||('Erreur '+r.status))}
  return j;
}
const tp=t=>cfg.base+'/'+encodeURIComponent(t);
async function listAll(t){let out=[],off;do{const j=await api(tp(t)+(off?'?offset='+off:''));out.push(...j.records);off=j.offset}while(off);return out}
async function aCreate(t,fields){const j=await api(tp(t),{method:'POST',body:JSON.stringify({records:[{fields}],typecast:true})});return j.records[0]}
async function aUpdate(t,id,fields){return api(tp(t)+'/'+id,{method:'PATCH',body:JSON.stringify({fields,typecast:true})})}
async function aDelete(t,ids){for(let i=0;i<ids.length;i+=10){await api(tp(t)+'?'+ids.slice(i,i+10).map(x=>'records[]='+x).join('&'),{method:'DELETE'})}}
async function run(fn){busy(true);try{return await fn()}catch(e){toast('⚠️ '+e.message);console.error(e)}finally{busy(false)}}

async function ensureSchema(){
  const meta=await api('meta/bases/'+cfg.base+'/tables');const tables=meta.tables;
  const DATE={type:'date',options:{dateFormat:{name:'iso'}}};
  async function ensure(name,fields){
    let t=tables.find(x=>x.name===name);
    if(!t){t=await api('meta/bases/'+cfg.base+'/tables',{method:'POST',body:JSON.stringify({name,fields})});tables.push(t);return t}
    for(const f of fields){if(!t.fields.find(x=>x.name===f.name)){const nf=await api('meta/bases/'+cfg.base+'/tables/'+t.id+'/fields',{method:'POST',body:JSON.stringify(f)});t.fields.push(nf)}}
    return t;
  }
  const D=await ensure(T.D,[{name:'Nom',type:'singleLineText'},{name:'Parent',type:'singleLineText'}]);
  const F=await ensure(T.F,[{name:'Titre',type:'singleLineText'},{name:'Dossier',type:'multipleRecordLinks',options:{linkedTableId:D.id}},{name:'Objectif',type:'multilineText'},{name:'Échéance',...DATE},{name:'Statut',type:'singleSelect',options:{choices:[{name:'En cours'},{name:'En pause'},{name:'Terminée'}]}}]);
  await ensure(T.E,[{name:'Libellé',type:'singleLineText'},{name:'Fiche',type:'multipleRecordLinks',options:{linkedTableId:F.id}},{name:'Date prévue',...DATE},{name:'Faite',type:'checkbox',options:{icon:'check',color:'greenBright'}},{name:'Date réalisation',...DATE},{name:'Ordre',type:'number',options:{precision:0}}]);
  await ensure(T.J,[{name:'Titre',type:'singleLineText'},{name:'Texte',type:'multilineText'},{name:'Fiche',type:'multipleRecordLinks',options:{linkedTableId:F.id}},{name:'Moment',type:'dateTime',options:{dateFormat:{name:'iso'},timeFormat:{name:'24hour'},timeZone:'Europe/Paris'}}]);
}
async function loadAll(){
  const[d,f,e,j]=await Promise.all([listAll(T.D),listAll(T.F),listAll(T.E),listAll(T.J)]);
  S={dossiers:d.filter(x=>fv(x,'Nom')),fiches:f.filter(x=>fv(x,'Titre')),etapes:e,journal:j};
}

/* ========= Voix : lecture ========= */
let frVoice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();frVoice=vs.find(v=>v.lang==='fr-FR'&&/google/i.test(v.name))||vs.find(v=>(v.lang||'').toLowerCase().startsWith('fr'))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text){
  if(!('speechSynthesis' in window)){toast('Lecture vocale non disponible sur ce navigateur');return}
  speechSynthesis.cancel();
  const parts=(text.match(/[^.!?]+[.!?]?/g)||[text]).map(s=>s.trim()).filter(Boolean);
  parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p);u.lang='fr-FR';if(frVoice)u.voice=frVoice;u.rate=1;if(i===parts.length-1){u.onend=()=>$('#stop').hidden=true;u.onerror=()=>$('#stop').hidden=true}speechSynthesis.speak(u)});
  $('#stop').hidden=false;
}
function stopSpeak(){speechSynthesis.cancel();$('#stop').hidden=true}

function synth(f){
  const id=f.id,todo=todoOf(id),done=doneOf(id),notes=notesOf(id);let t='';
  t+=`Sujet : ${fv(f,'Titre')}. `;
  const dp=dPath(ficheDossier(f));if(dp)t+=`Dossier : ${dp.replace(' › ',', ')}. `;
  t+=fv(f,'Objectif')?`Objectif : ${fv(f,'Objectif').trim().replace(/[.!?]*$/,'')}. `:`Aucun objectif n'est encore défini. `;
  if(fv(f,'Échéance'))t+=`Échéance : ${spokenRel(fv(f,'Échéance'))}. `;
  if(fv(f,'Statut')==='En pause')t+='Cette fiche est en pause. ';
  if(done.length){
    const last=done.slice(-5);
    t+=done.length===1?'Une étape réalisée : ':`${done.length} étapes réalisées${done.length>5?', dont les plus récentes':''} : `;
    t+=last.map(s=>fv(s,'Libellé')+(fv(s,'Date réalisation')?', '+spokenRel(fv(s,'Date réalisation')):'')).join('. ')+'. ';
  }else t+='Aucune étape réalisée pour le moment. ';
  if(notes.length){const n=notes[0];t+=`Dernière note, ${spokenRel(localDay(fv(n,'Moment')))} : ${(fv(n,'Texte')||'').trim().replace(/[.!?]*$/,'')}. `}
  if(fv(f,'Statut')==='Terminée')t+='Cette fiche est terminée. ';
  else if(todo.length){
    const nx=todo[0],d=fv(nx,'Date prévue');
    t+=`Prochaine étape : ${fv(nx,'Libellé')}`+(d?`, prévue ${spokenRel(d)}${d<today()?', en retard':''}`:', pas encore planifiée')+'. ';
    if(todo.length>1)t+=`Il restera ensuite ${todo.length-1} étape${todo.length>2?'s':''}. `;
  }else t+="Aucune prochaine étape n'est définie. ";
  return t;
}
function listenFiche(id){const f=fiche(id);if(f)speak(synth(f))}
function listenDay(){
  const ids=dayFicheIds();
  if(!ids.length){speak(`Bonjour. Nous sommes ${fmtLong(today())}. Rien n'est prévu aujourd'hui.`);return}
  speak(`Bonjour. Nous sommes ${fmtLong(today())}. Tu as ${ids.length} sujet${ids.length>1?'s':''} à traiter. `+ids.map(i=>synth(fiche(i))).join(' '));
}

/* ========= Voix : dictée ========= */
let dict=null;
function dictate(btn,targetId,onDone){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("Dictée indisponible ici : utilise le micro du clavier.");return}
  if(dict){const same=dict.btn===btn;dict.stop();if(same)return}
  const el=document.getElementById(targetId);const r=new SR();
  r.lang='fr-FR';r.continuous=false;r.interimResults=false;
  const st={btn,active:true,silent:0,stop(){st.active=false;try{r.stop()}catch(_){}}};
  dict=st;btn.classList.add('rec');btn.textContent='⏹';
  r.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript;
    if(t.trim()){st.silent=0;const cur=document.getElementById(targetId)||el;cur.value=(cur.value.trim()?cur.value.trim()+' ':'')+t.trim();cur.dispatchEvent(new Event('input',{bubbles:true}))}};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){toast('Autorise le micro pour cette page.');st.active=false}
    else if(e.error==='no-speech'){if(++st.silent>=2)st.active=false}};
  r.onend=()=>{if(st.active){try{r.start();return}catch(_){}}
    btn.classList.remove('rec');btn.textContent='🎤';if(dict===st)dict=null;if(onDone)onDone()};
  try{r.start()}catch(e){toast('Micro indisponible');btn.classList.remove('rec');btn.textContent='🎤';dict=null}
}

/* ========= Navigation ========= */
function go(v){view=v;setupMode=false;render();window.scrollTo(0,0)}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',!setupMode&&b.dataset.v===view));
  const m=$('#main');
  if(setupMode||!cfg.token||!cfg.base){m.innerHTML=vSetup();return}
  m.innerHTML=({today:vToday,week:vWeek,folders:vFolders,history:vHistory})[view]();
  if(openId)renderFiche();
}

/* ========= Éléments communs ========= */
function statusBadge(f){const s=fv(f,'Statut')||'En cours';return`<span class="badge ${s==='Terminée'?'ok':s==='En pause'?'pause':''}">${esc(s)}</span>`}
function dateBadge(d,done){if(!d)return'';const late=!done&&d<today();return`<span class="badge ${late?'late':''}">${d===today()?"Aujourd'hui":esc(fmtShort(d))}</span>`}
function stepRow(e,opt={}){
  const done=!!fv(e,'Faite');const f=fiche(ficheOf(e));
  return`<div class="step ${done?'done':''}">
    <input type="checkbox" ${done?'checked':''} onchange="toggleStep('${e.id}',this.checked)">
    <div class="lbl" onclick="${opt.inFiche?`renameStep('${e.id}')`:`openFiche('${ficheOf(e)}')`}">${esc(fv(e,'Libellé'))}${opt.showFiche&&f?`<div class="muted">${esc(fv(f,'Titre'))}</div>`:''}</div>
    ${opt.inFiche?`<input type="date" class="sm" value="${esc(fv(e,'Date prévue')||'')}" onchange="setStepDate('${e.id}',this.value)"><button class="ico" onclick="delStep('${e.id}')">🗑</button>`:(opt.noDate?'':dateBadge(fv(e,'Date prévue'),done))}
  </div>`;
}
function groupCards(steps,opt={}){
  const by={};steps.forEach(e=>{(by[ficheOf(e)]=by[ficheOf(e)]||[]).push(e)});
  return Object.keys(by).filter(fiche).map(id=>{const f=fiche(id);const dp=dPath(ficheDossier(f));
    return`<div class="card"><div class="ftitle"><b onclick="openFiche('${id}')">${esc(fv(f,'Titre'))}</b><button class="ico" onclick="listenFiche('${id}')" title="Écouter">🔊</button></div>
    ${dp?`<div class="muted">📁 ${esc(dp)}</div>`:''}${by[id].sort(sortTodo).map(e=>stepRow(e,opt)).join('')}</div>`}).join('');
}

/* ========= Vue Aujourd'hui ========= */
function dayFicheIds(){const t=today();
  const ids=S.etapes.filter(e=>!fv(e,'Faite')&&fv(e,'Date prévue')&&fv(e,'Date prévue')<=t).map(ficheOf).filter(id=>{const f=fiche(id);return f&&fv(f,'Statut')!=='Terminée'});
  return[...new Set(ids)];}
function vToday(){
  const t=today();
  const live=e=>{const f=fiche(ficheOf(e));return f&&fv(f,'Statut')!=='Terminée'};
  const pend=S.etapes.filter(e=>!fv(e,'Faite')&&fv(e,'Date prévue')&&fv(e,'Date prévue')<=t&&live(e));
  const now=pend.filter(e=>fv(e,'Date prévue')===t),late=pend.filter(e=>fv(e,'Date prévue')<t);
  const doneT=S.etapes.filter(e=>fv(e,'Faite')&&fv(e,'Date réalisation')===t&&fiche(ficheOf(e)));
  const ech=S.fiches.filter(f=>fv(f,'Statut')!=='Terminée'&&fv(f,'Échéance')&&diffDays(fv(f,'Échéance'),t)>=0&&diffDays(fv(f,'Échéance'),t)<=7).sort((a,b)=>fv(a,'Échéance').localeCompare(fv(b,'Échéance')));
  let h=`<div class="muted" style="text-transform:capitalize;margin-top:4px">${esc(fmtLong(t))}</div>
  <button class="big listen" onclick="listenDay()">🔊 Écouter ma journée</button>`;
  h+=`<h2>À faire aujourd'hui</h2>`+(now.length?groupCards(now):`<div class="card empty">Rien de prévu aujourd'hui.</div>`);
  if(late.length)h+=`<h2 style="color:var(--late)">En retard</h2>`+groupCards(late);
  if(ech.length)h+=`<h2>Échéances dans les 7 jours</h2><div class="card">`+ech.map(f=>`<div class="step"><div class="lbl" onclick="openFiche('${f.id}')"><b>${esc(fv(f,'Titre'))}</b></div>${dateBadge(fv(f,'Échéance'))}</div>`).join('')+`</div>`;
  if(doneT.length)h+=`<h2>Fait aujourd'hui ✅</h2><div class="card">`+doneT.map(e=>stepRow(e,{showFiche:true,noDate:true})).join('')+`</div>`;
  h+=`<button class="btn pri" style="width:100%;margin-top:14px" onclick="newFiche('')">＋ Nouvelle fiche</button>`;
  return h;
}

/* ========= Vue Semaine ========= */
function vWeek(){
  const t=today();const mon=addDays(t,-((parseD(t).getDay()+6)%7)+weekOffset*7);
  const live=e=>{const f=fiche(ficheOf(e));return f&&fv(f,'Statut')!=='Terminée'};
  let h=`<div class="weeknav"><button class="btn" onclick="weekOffset--;render()">‹</button><b>Semaine du ${esc(parseD(mon).toLocaleDateString('fr-FR',{day:'numeric',month:'long'}))}</b><button class="btn" onclick="weekOffset++;render()">›</button></div>`;
  if(weekOffset)h+=`<div style="text-align:center;margin-bottom:8px"><button class="btn" onclick="weekOffset=0;render()">Revenir à cette semaine</button></div>`;
  for(let i=0;i<7;i++){const d=addDays(mon,i);
    const st=S.etapes.filter(e=>fv(e,'Date prévue')===d&&fiche(ficheOf(e))).sort((a,b)=>(fv(a,'Faite')?1:0)-(fv(b,'Faite')?1:0)||sortTodo(a,b));
    h+=`<div class="card day ${d===t?'today':''}"><h3>${esc(fmtLong(d))}${d===t?' · aujourd\u2019hui':''}</h3>${st.length?st.map(e=>stepRow(e,{showFiche:true,noDate:true})).join(''):'<div class="empty">—</div>'}</div>`;}
  const unp=S.etapes.filter(e=>!fv(e,'Faite')&&!fv(e,'Date prévue')&&live(e)).sort(sortTodo);
  h+=`<h2>Étapes non planifiées</h2>`;
  h+=unp.length?`<div class="card">`+unp.map(e=>{const f=fiche(ficheOf(e));return`<div class="step"><div class="lbl" onclick="openFiche('${f.id}')">${esc(fv(e,'Libellé'))}<div class="muted">${esc(fv(f,'Titre'))}</div></div><input type="date" class="sm" onchange="setStepDate('${e.id}',this.value)"></div>`}).join('')+`</div>`:`<div class="card empty">Tout est planifié 👍</div>`;
  return h;
}

/* ========= Vue Dossiers ========= */
function ficheItem(f){const todo=todoOf(f.id),done=doneOf(f.id),nx=todo[0];
  return`<div class="fitem" onclick="openFiche('${f.id}')"><div style="display:flex;gap:6px;align-items:center"><span class="t" style="flex:1">${esc(fv(f,'Titre'))}</span>${statusBadge(f)}</div>
  <div class="muted">${done.length}/${done.length+todo.length} étapes${nx?' · ➜ '+esc(fv(nx,'Libellé')):''}</div></div>`}
function fichesIn(id){return S.fiches.filter(f=>ficheDossier(f)===id).sort((a,b)=>((fv(a,'Statut')==='Terminée')-(fv(b,'Statut')==='Terminée'))||(fv(a,'Titre')||'').localeCompare(fv(b,'Titre')||'','fr'))}
function countIn(id){const ids=[id,...children(id).map(c=>c.id)];return S.fiches.filter(f=>ids.includes(ficheDossier(f))&&fv(f,'Statut')!=='Terminée').length}
function folderBlock(d,lvl){
  const open=openFolders.has(d.id);const kids=children(d.id);const fs=fichesIn(d.id);
  let h=`<div class="${lvl?'':'card '}folder"><div class="fhead"><span class="nm" onclick="toggleFolder('${d.id}')">${open?'▾':'▸'} ${lvl?'📂':'📁'} ${esc(fv(d,'Nom'))} <span class="muted">(${countIn(d.id)})</span></span>
  <button class="ico" title="Nouvelle fiche" onclick="newFiche('${d.id}')">＋</button>
  ${lvl?'':`<button class="ico" title="Nouveau sous-dossier" onclick="newFolder('${d.id}')">📂</button>`}
  <button class="ico" title="Renommer" onclick="renameFolder('${d.id}')">✏️</button><button class="ico" title="Supprimer" onclick="delFolder('${d.id}')">🗑</button></div>`;
  if(open){h+=`<div class="sub">`+kids.map(k=>folderBlock(k,1)).join('')+fs.map(ficheItem).join('')+(!kids.length&&!fs.length?'<div class="empty">Vide</div>':'')+`</div>`}
  return h+`</div>`;
}
function vFolders(){
  let h=`<div style="display:flex;gap:8px;margin:4px 0 12px"><button class="btn pri" style="flex:1" onclick="newFolder('')">＋ Dossier</button><button class="btn" style="flex:1" onclick="newFiche('')">＋ Fiche</button></div>`;
  h+=roots().map(d=>folderBlock(d,0)).join('');
  const orphan=S.fiches.filter(f=>!dossier(ficheDossier(f)));
  if(orphan.length)h+=`<div class="card"><div class="fhead"><span class="nm">📄 Sans dossier</span></div>${orphan.map(ficheItem).join('')}</div>`;
  if(!S.dossiers.length&&!orphan.length)h+=`<div class="card empty">Aucun dossier pour le moment.</div>`;
  return h;
}
function toggleFolder(id){openFolders.has(id)?openFolders.delete(id):openFolders.add(id);saveOpen();render()}

/* ========= Vue Historique ========= */
function vHistory(){
  const ev=[];
  S.etapes.filter(e=>fv(e,'Faite')&&fv(e,'Date réalisation')&&fiche(ficheOf(e))).forEach(e=>ev.push({d:fv(e,'Date réalisation'),k:'0',html:`✅ ${esc(fv(e,'Libellé'))}`,f:ficheOf(e)}));
  S.journal.filter(j=>fv(j,'Moment')&&fiche((fv(j,'Fiche')||[])[0])).forEach(j=>{const m=new Date(fv(j,'Moment'));ev.push({d:localDay(fv(j,'Moment')),k:'1'+fv(j,'Moment'),html:`📝 <span class="muted">${pad(m.getHours())}h${pad(m.getMinutes())}</span> ${esc(fv(j,'Texte'))}`,f:fv(j,'Fiche')[0]})});
  if(!ev.length)return`<h2>Historique</h2><div class="card empty">Rien encore. Les étapes cochées et les notes apparaîtront ici.</div>`;
  ev.sort((a,b)=>b.d.localeCompare(a.d)||b.k.localeCompare(a.k));
  const by={};ev.slice(0,200).forEach(e=>(by[e.d]=by[e.d]||[]).push(e));
  return Object.keys(by).map(d=>`<h2 style="text-transform:capitalize">${esc(fmtLong(d))}</h2><div class="card">`+by[d].map(e=>`<div class="note" onclick="openFiche('${e.f}')" style="cursor:pointer">${e.html}<div class="muted">${esc(fv(fiche(e.f),'Titre'))}</div></div>`).join('')+`</div>`).join('');
}

/* ========= Fiche ========= */
function folderOptions(sel){let o=`<option value="">— Sans dossier —</option>`;
  roots().forEach(r=>{o+=`<option value="${r.id}" ${r.id===sel?'selected':''}>${esc(fv(r,'Nom'))}</option>`;children(r.id).forEach(c=>{o+=`<option value="${c.id}" ${c.id===sel?'selected':''}>   ↳ ${esc(fv(c,'Nom'))}</option>`})});return o}
function openFiche(id){if(openId!==id){draft.step='';draft.stepDate='';draft.note=''}openId=id;renderFiche()}
function closeFiche(){openId=null;$('#panel').hidden=true;document.body.style.overflow='';render()}
function renderFiche(){
  const f=fiche(openId);if(!f){openId=null;$('#panel').hidden=true;document.body.style.overflow='';return}
  const p=$('#panel');const sc=p.scrollTop;const todo=todoOf(f.id),done=doneOf(f.id),notes=notesOf(f.id);
  p.innerHTML=`<div class="top"><button onclick="closeFiche()">←</button><input id="fTitle" value="${esc(fv(f,'Titre'))}" onchange="saveFiche('Titre',this.value.trim()||'Sans titre')"><button onclick="delFiche()" title="Supprimer la fiche">🗑</button></div>
  <div class="in">
    <button class="big listen" onclick="listenFiche('${f.id}')">🔊 Écouter la synthèse</button>
    <div class="card">
      <label class="f">Dossier</label><select onchange="saveFiche('Dossier',this.value?[this.value]:[])">${folderOptions(ficheDossier(f))}</select>
      <div class="row2"><div><label class="f">Statut</label><select onchange="saveFiche('Statut',this.value)">${['En cours','En pause','Terminée'].map(s=>`<option ${(fv(f,'Statut')||'En cours')===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div><label class="f">Échéance</label><input type="date" value="${esc(fv(f,'Échéance')||'')}" onchange="saveFiche('Échéance',this.value||null)"></div></div>
      <label class="f">🎯 Objectif</label>
      <div class="dict"><textarea id="fObj" placeholder="Quel résultat veux-tu obtenir ?" onchange="saveFiche('Objectif',this.value)">${esc(fv(f,'Objectif')||'')}</textarea><button class="mic" onclick="dictate(this,'fObj',saveObj)">🎤</button></div>
    </div>
    <h2>Étapes · ${done.length}/${done.length+todo.length} faites</h2>
    <div class="card">
      ${todo.length||done.length?'':'<div class="empty">Aucune étape. Ajoute la première ci-dessous.</div>'}
      ${todo.map(e=>stepRow(e,{inFiche:true})).join('')}
      ${done.map(e=>stepRow(e,{inFiche:true})).join('')}
      <div class="dict" style="margin-top:10px"><input type="text" id="sLabel" placeholder="Nouvelle étape…" value="${esc(draft.step)}" oninput="draft.step=this.value" onkeydown="if(event.key==='Enter')addStep()"><button class="mic" onclick="dictate(this,'sLabel')">🎤</button></div>
      <div class="addrow"><span class="muted">Prévue le</span><input type="date" class="sm" id="sDate" value="${esc(draft.stepDate)}" onchange="draft.stepDate=this.value"><button class="btn pri" style="margin-left:auto" onclick="addStep()">Ajouter l'étape</button></div>
    </div>
    <h2>📝 Journal</h2>
    <div class="card">
      <div class="dict"><textarea id="nText" placeholder="Où en es-tu ? (dicte avec 🎤)" oninput="draft.note=this.value">${esc(draft.note)}</textarea><button class="mic" onclick="dictate(this,'nText')">🎤</button></div>
      <div class="addrow"><button class="btn pri" style="margin-left:auto" onclick="addNote()">Ajouter la note</button></div>
    </div>
    ${notes.length?`<div class="card">`+notes.map(n=>{const m=new Date(fv(n,'Moment')||Date.now());return`<div class="note"><div class="muted" style="display:flex"><span style="flex:1;text-transform:capitalize">${esc(fmtShort(ymd(m)))} · ${pad(m.getHours())}h${pad(m.getMinutes())}</span><button class="ico" onclick="delNote('${n.id}')">🗑</button></div>${esc(fv(n,'Texte'))}</div>`}).join('')+`</div>`:''}
  </div>`;
  p.hidden=false;document.body.style.overflow='hidden';p.scrollTop=sc;
}
function saveObj(){const f=fiche(openId);const v=$('#fObj')?.value??'';if(f&&v!==(fv(f,'Objectif')||''))saveFiche('Objectif',v)}

/* ========= Actions ========= */
async function saveFiche(field,val){const f=fiche(openId);if(!f)return;
  await run(async()=>{await aUpdate(T.F,f.id,{[field]:val});f.fields[field]=val===null?undefined:val;render()})}
async function newFiche(dId){
  const t=prompt('Nom du nouveau sujet ?');if(!t||!t.trim())return;
  await run(async()=>{const fields={Titre:t.trim(),Statut:'En cours'};if(dId)fields.Dossier=[dId];
    const r=await aCreate(T.F,fields);S.fiches.push(r);if(dId){openFolders.add(dId);const p=parentOf(dossier(dId));if(p)openFolders.add(p);saveOpen()}openFiche(r.id);render()})}
async function delFiche(){const f=fiche(openId);if(!f||!confirm(`Supprimer la fiche « ${fv(f,'Titre')} » avec ses étapes et son journal ?`))return;
  await run(async()=>{const es=stepsOf(f.id).map(e=>e.id),js=notesOf(f.id).map(j=>j.id);
    if(es.length)await aDelete(T.E,es);if(js.length)await aDelete(T.J,js);await aDelete(T.F,[f.id]);
    S.etapes=S.etapes.filter(e=>!es.includes(e.id));S.journal=S.journal.filter(j=>!js.includes(j.id));S.fiches=S.fiches.filter(x=>x.id!==f.id);closeFiche();toast('Fiche supprimée')})}
async function addStep(){
  const lbl=($('#sLabel')?.value||'').trim();if(!lbl){toast("Écris ou dicte d'abord l'étape");return}
  const date=$('#sDate')?.value||'';const id=openId;
  await run(async()=>{const ord=Math.max(0,...stepsOf(id).map(e=>fv(e,'Ordre')||0))+1;
    const fields={'Libellé':lbl,Fiche:[id],Ordre:ord};if(date)fields['Date prévue']=date;
    const r=await aCreate(T.E,fields);S.etapes.push(r);draft.step='';draft.stepDate='';render()})}
async function toggleStep(id,on){const e=S.etapes.find(x=>x.id===id);if(!e)return;
  const fields={Faite:on,'Date réalisation':on?today():null};
  await run(async()=>{await aUpdate(T.E,id,fields);e.fields.Faite=on;e.fields['Date réalisation']=on?today():undefined;render();if(on)toast('Étape faite ✅')})}
async function setStepDate(id,val){const e=S.etapes.find(x=>x.id===id);if(!e)return;
  await run(async()=>{await aUpdate(T.E,id,{'Date prévue':val||null});e.fields['Date prévue']=val||undefined;render()})}
async function renameStep(id){const e=S.etapes.find(x=>x.id===id);if(!e)return;const v=prompt("Modifier l'étape :",fv(e,'Libellé'));if(!v||!v.trim()||v===fv(e,'Libellé'))return;
  await run(async()=>{await aUpdate(T.E,id,{'Libellé':v.trim()});e.fields['Libellé']=v.trim();render()})}
async function delStep(id){if(!confirm('Supprimer cette étape ?'))return;
  await run(async()=>{await aDelete(T.E,[id]);S.etapes=S.etapes.filter(e=>e.id!==id);render()})}
async function addNote(){const txt=($('#nText')?.value||'').trim();if(!txt){toast("Écris ou dicte d'abord ta note");return}const id=openId;
  await run(async()=>{const r=await aCreate(T.J,{Titre:txt.slice(0,60),Texte:txt,Fiche:[id],Moment:new Date().toISOString()});S.journal.push(r);draft.note='';render();toast('Note ajoutée')})}
async function delNote(id){if(!confirm('Supprimer cette note ?'))return;
  await run(async()=>{await aDelete(T.J,[id]);S.journal=S.journal.filter(j=>j.id!==id);render()})}
async function newFolder(parent){const n=prompt(parent?`Nom du sous-dossier dans « ${fv(dossier(parent),'Nom')} » ?`:'Nom du nouveau dossier ?');if(!n||!n.trim())return;
  await run(async()=>{const r=await aCreate(T.D,{Nom:n.trim(),Parent:parent||''});S.dossiers.push(r);if(parent){openFolders.add(parent);saveOpen()}render()})}
async function renameFolder(id){const d=dossier(id);const n=prompt('Nouveau nom :',fv(d,'Nom'));if(!n||!n.trim()||n===fv(d,'Nom'))return;
  await run(async()=>{await aUpdate(T.D,id,{Nom:n.trim()});d.fields.Nom=n.trim();render()})}
async function delFolder(id){const d=dossier(id);
  if(children(id).length||fichesIn(id).length){alert('Ce dossier contient des sous-dossiers ou des fiches. Déplace-les ou supprime-les d\u2019abord.');return}
  if(!confirm(`Supprimer le dossier « ${fv(d,'Nom')} » ?`))return;
  await run(async()=>{await aDelete(T.D,[id]);S.dossiers=S.dossiers.filter(x=>x.id!==id);render()})}

/* ========= Réglages ========= */
function showSetup(){setupMode=true;if(openId)closeFiche();render()}
function vSetup(){return`<div class="card setup"><h3 style="margin-top:0">⚙ Connexion à Airtable</h3>
  <ol>
    <li>Dans Airtable, crée une <b>base vide</b> nommée « Mes Fiches ».</li>
    <li>Ouvre-la et copie son adresse (elle contient <code>app…</code>). Colle-la ci-dessous.</li>
    <li>Va dans <b>Espace constructeur → Jetons d'accès personnels</b> et crée un jeton avec :<br>
      <code>data.records:read</code> <code>data.records:write</code> <code>schema.bases:read</code> <code>schema.bases:write</code><br>et l'accès à la base « Mes Fiches ».</li>
    <li>Colle le jeton ci-dessous, puis appuie sur le bouton. Les tables se créent toutes seules.</li>
  </ol>
  <label class="f">Adresse ou ID de la base</label><input type="text" id="cBase" placeholder="https://airtable.com/app… ou app…" value="${esc(cfg.base||'')}">
  <label class="f">Jeton d'accès</label><input type="password" id="cTok" placeholder="pat…" value="${esc(cfg.token||'')}">
  <button class="big listen" style="margin-top:14px" onclick="connect()">Connecter et préparer la base</button>
  ${cfg.token?`<button class="btn" style="width:100%" onclick="setupMode=false;render()">Annuler</button>`:''}
  <p class="muted">Ces réglages restent sur ce téléphone uniquement.</p></div>`}
async function connect(){
  const raw=$('#cBase').value.trim();const m=raw.match(/app[A-Za-z0-9]{14}/);const tok=$('#cTok').value.trim();
  if(!m){toast("ID de base introuvable : il commence par « app »");return}if(!tok){toast('Colle ton jeton');return}
  cfg={base:m[0],token:tok};try{localStorage.setItem('mf_cfg',JSON.stringify(cfg))}catch(_){}
  const ok=await run(async()=>{await ensureSchema();await loadAll();
    if(!S.dossiers.length){const recs=await api(tp(T.D),{method:'POST',body:JSON.stringify({records:DEFAULT_FOLDERS.map(n=>({fields:{Nom:n,Parent:''}})),typecast:true})});S.dossiers.push(...recs.records)}
    return true});
  if(ok){setupMode=false;toast('Base prête ✅');go('folders')}
}
async function reload(){if(!cfg.token)return;await run(loadAll);render();toast('Actualisé')}

/* ========= Démarrage ========= */
(async()=>{render();if(cfg.token&&cfg.base){const ok=await run(async()=>{await loadAll();return true});if(!ok){setupMode=true}render()}})();
</script>
</body>
</html>
